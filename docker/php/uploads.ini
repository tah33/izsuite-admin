; PHP's defaults (2M upload / 8M post) are smaller than what the app accepts.
; Resume/CV uploads go through smalot/pdfparser and dompdf generates invoices,
; both of which need headroom beyond the stock limits. A digital product's
; file may be up to 100 MB, so a request carrying one needs a little more.
; A proxy in front (host nginx) needs a matching client_max_body_size.

upload_max_filesize = 110M
post_max_size = 120M
memory_limit = 512M
max_execution_time = 120

; Uploading several files at once (bulk imports) exceeds the default of 20.
max_file_uploads = 50
